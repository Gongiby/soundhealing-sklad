<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0c0a09" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23b45309'/%3E%3Ccircle cx='50' cy='50' r='25' fill='%23fef3c7'/%3E%3Ccircle cx='50' cy='50' r='10' fill='%23b45309'/%3E%3C/svg%3E" />
    <title>SoundHealing.by — Система управления магазином</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Предотвращаем back-swipe и pull-to-refresh
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) return;
        // Разрешаем обычные тапы, блокируем только свайпы от края экрана
      }, { passive: true });

      // Блокируем горизонтальный overscroll (свайп назад)
      let lastTouchX = 0;
      document.addEventListener('touchstart', function(e) {
        lastTouchX = e.touches[0].clientX;
      }, { passive: true });
      document.addEventListener('touchmove', function(e) {
        const touchX = e.touches[0].clientX;
        const diffX = lastTouchX - touchX;
        const isLeftEdge = lastTouchX < 30;
        // Если свайп начинается у левого края — блокируем навигацию
        if (isLeftEdge && diffX > 0) {
          e.preventDefault();
        }
        lastTouchX = touchX;
      }, { passive: false });

      // Блокируем context menu на долгом тапе (чтобы случайно не вызвать меню)
      document.addEventListener('contextmenu', function(e) {
        if (e.target.closest('.no-context-menu')) {
          e.preventDefault();
        }
      });
    </script>
  </body>
</html>
